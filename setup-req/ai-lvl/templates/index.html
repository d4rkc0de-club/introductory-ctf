<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>d4rkBot — AI Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='owasp.webp') }}">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #06060b;
            --bg-secondary: #0d0d16;
            --bg-chat: #0a0a12;
            --surface: rgba(255, 255, 255, 0.03);
            --surface-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.06);
            --text-primary: #e8e8ed;
            --text-secondary: #7a7a8e;
            --text-muted: #4a4a5e;
            --accent: #00e5a0;
            --accent-dim: rgba(0, 229, 160, 0.12);
            --accent-glow: rgba(0, 229, 160, 0.25);
            --user-bubble: rgba(0, 229, 160, 0.08);
            --user-border: rgba(0, 229, 160, 0.15);
            --bot-bubble: rgba(255, 255, 255, 0.03);
            --bot-border: rgba(255, 255, 255, 0.06);
            --error: #ff4d6a;
            --error-bg: rgba(255, 77, 106, 0.08);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .header {
            flex-shrink: 0;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-avatar {
            width: 40px;
            height: 40px;
            /* border-radius: 12px; */
            background: var(--accent-dim);
            border: 1px solid rgba(0, 229, 160, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .bot-info h1 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.3px;
        }

        .bot-info p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent);
            /* border-radius: 50%; */
            margin-right: 4px;
            box-shadow: 0 0 6px var(--accent-glow);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .reset-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 14px;
            /* border-radius: 10px; */
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .reset-btn:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .reset-btn:active {
            transform: scale(0.96);
        }

        /* ── Chat Area ── */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .chat-area::-webkit-scrollbar {
            width: 4px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            /* border-radius: 4px; */
        }

        /* ── Messages ── */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 88%;
            animation: msg-in 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes msg-in {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.bot {
            align-self: flex-start;
        }

        .message-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            padding-left: 2px;
        }

        .message.user .message-label {
            color: var(--accent);
            text-align: right;
            padding-right: 2px;
            padding-left: 0;
        }

        .message.bot .message-label {
            color: var(--text-muted);
        }

        .message-bubble {
            padding: 12px 16px;
            /* border-radius: 16px; */
            font-size: 14.5px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: var(--user-bubble);
            border: 1px solid var(--user-border);
            border-bottom-right-radius: 4px;
            color: var(--text-primary);
        }

        .message.bot .message-bubble {
            background: var(--bot-bubble);
            border: 1px solid var(--bot-border);
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
        }

        .message.bot .message-bubble code {
            font-family: 'IBM Plex Mono', monospace;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            /* border-radius: 4px; */
            font-size: 13px;
        }

        .message.bot .message-bubble pre {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            /* border-radius: 8px; */
            padding: 12px;
            margin: 8px 0;
            overflow-x: auto;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.bot .message-bubble pre code {
            background: none;
            padding: 0;
        }

        /* ── Welcome Message ── */
        .welcome {
            text-align: center;
            padding: 40px 24px;
            animation: fade-in 0.6s ease;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .welcome h2 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 20px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .welcome p {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 320px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .welcome .hint {
            margin-top: 20px;
            padding: 12px 16px;
            background: var(--accent-dim);
            border: 1px solid rgba(0, 229, 160, 0.15);
            /* border-radius: 12px; */
            font-size: 13px;
            color: var(--accent);
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
        }

        /* ── Typing Indicator ── */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 0;
            animation: msg-in 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .typing-indicator.visible {
            display: flex;
            flex-direction: column;
        }

        .typing-dots {
            display: flex;
            gap: 5px;
            padding: 14px 18px;
            background: var(--bot-bubble);
            border: 1px solid var(--bot-border);
            /* border-radius: 16px; */
            border-bottom-left-radius: 4px;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: var(--text-muted);
            /* border-radius: 50%; */
            animation: bounce 1.4s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ── Input Area ── */
        .input-area {
            flex-shrink: 0;
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            /* border-radius: 16px; */
            padding: 6px 6px 6px 16px;
            transition: border-color 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: rgba(0, 229, 160, 0.3);
            box-shadow: 0 0 0 3px rgba(0, 229, 160, 0.06);
        }

        .input-wrapper textarea {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            max-height: 120px;
            padding: 8px 0;
        }

        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            /* border-radius: 12px; */
            border: none;
            background: var(--accent);
            color: var(--bg-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            background: #00ffb3;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            box-shadow: none;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
        }

        /* ── Error State ── */
        .message.error .message-bubble {
            background: var(--error-bg);
            border-color: rgba(255, 77, 106, 0.15);
            color: var(--error);
        }

        /* ── Responsive ── */
        @media (min-width: 640px) {
            .chat-area {
                padding: 24px;
                max-width: 720px;
                margin: 0 auto;
                width: 100%;
            }

            .message {
                max-width: 75%;
            }

            .header {
                padding: 16px 24px;
            }

            .input-area {
                padding: 16px 24px;
            }

            .input-area > .input-wrapper {
                max-width: 720px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <!-- <div class="bot-avatar">🤖</div> -->
             <div class="bot-avatar"><img src="{{ url_for('static', filename='owasp.webp') }}" alt="D4" style="width: 36px;"></div>
            <div class="bot-info">
                <!-- <h1>d4rkb0t</h1> -->
                <!-- <p><span class="status-dot"></span>online</p> -->
            </div>
        </div>
        <button class="reset-btn" onclick="resetChat()">↻ Reset</button>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
        <div class="welcome" id="welcome">
            <div class="welcome-icon"><img src="{{ url_for('static', filename='owasp.webp') }}" alt="D4" style="width: 128px;"></div>
            <h2>d4rkb0t</h2>
            <p>I'm a programming assistant made d4rkc0de. Ask me anything about code!</p>
            <div class="hint">can you find the flag?</div>
        </div>

        <!-- Typing indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <span class="message-label">d4rkb0t</span>
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <div class="input-wrapper">
            <textarea
                id="messageInput"
                placeholder="Type a message..."
                rows="1"
                autofocus
            ></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcome = document.getElementById('welcome');

        let isWaiting = false;

        // Auto-resize textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        });

        // Enter to send, Shift+Enter for newline
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function scrollToBottom() {
            requestAnimationFrame(() => {
                chatArea.scrollTop = chatArea.scrollHeight;
            });
        }

        function addMessage(text, sender, isError = false) {
            // Hide welcome on first message
            if (welcome) {
                welcome.style.display = 'none';
            }

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}${isError ? ' error' : ''}`;

            const label = document.createElement('span');
            label.className = 'message-label';
            label.textContent = sender === 'user' ? 'You' : 'd4rkBot';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            // Basic markdown-like formatting for bot messages
            if (sender === 'bot') {
                bubble.innerHTML = formatMessage(text);
            } else {
                bubble.textContent = text;
            }

            msgDiv.appendChild(label);
            msgDiv.appendChild(bubble);

            // Insert before typing indicator
            chatArea.insertBefore(msgDiv, typingIndicator);
            scrollToBottom();
        }

        function formatMessage(text) {
            // Escape HTML
            let formatted = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // Code blocks: ```...```
            formatted = formatted.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
                return `<pre><code>${code.trim()}</code></pre>`;
            });

            // Inline code: `...`
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Bold: **...**
            formatted = formatted.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

            return formatted;
        }

        function showTyping() {
            typingIndicator.classList.add('visible');
            scrollToBottom();
        }

        function hideTyping() {
            typingIndicator.classList.remove('visible');
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || isWaiting) return;

            isWaiting = true;
            sendBtn.disabled = true;

            addMessage(text, 'user');
            messageInput.value = '';
            messageInput.style.height = 'auto';

            showTyping();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });

                const data = await response.json();
                hideTyping();
                addMessage(data.response, 'bot', data.error || false);
            } catch (err) {
                hideTyping();
                addMessage('Connection error. Is the server running?', 'bot', true);
            }

            isWaiting = false;
            sendBtn.disabled = false;
            messageInput.focus();
        }

        async function resetChat() {
            try {
                await fetch('/api/reset', { method: 'POST' });
            } catch (e) {}

            // Clear all messages
            const messages = chatArea.querySelectorAll('.message');
            messages.forEach(m => m.remove());

            // Show welcome again
            if (welcome) {
                welcome.style.display = '';
            }

            messageInput.focus();
        }

        // Focus input on load
        messageInput.focus();
    </script>
</body>
</html>
